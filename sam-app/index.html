<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a6b3a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ASM" />
    <title>ASM - AgroServicios Morales</title>
    <script>
      // 🔴 Auto-reparación de la pantalla en blanco (25-sep-2026). Si el service
      // worker se actualiza JUSTO mientras Vercel cambia de versión, puede guardar
      // (para el modo sin señal) la página VIEJA junto a los archivos NUEVOS: la
      // página pide un archivo que ya no existe y la app queda en blanco, aunque se
      // recargue. Aquí se detecta, se trae la página vigente del servidor, se deja
      // en lugar de la guardada y se recarga una sola vez.
      // NO se desregistra el service worker: ahí vive la suscripción a los avisos.
      (function () {
        var CLAVE = 'sam:reparo-inicio';
        window.addEventListener('error', function (e) {
          var s = e.target;
          if (!s || s.tagName !== 'SCRIPT' || !/\/assets\/index-[^/]+\.js$/.test(s.src || '')) return;
          try {
            if (Date.now() - Number(sessionStorage.getItem(CLAVE) || 0) < 60000) return;
            sessionStorage.setItem(CLAVE, String(Date.now()));
          } catch (x) { return; }
          if (!('caches' in window)) return;
          // Con el parámetro no la contesta el service worker: va al servidor.
          fetch('/index.html?vigente=' + Date.now(), { cache: 'no-store' }).then(function (r) {
            if (!r.ok) return;
            return r.text().then(function (html) {
              var m = html.match(/\/assets\/index-[^"']+\.js/);
              if (!m || s.src.indexOf(m[0]) >= 0) return;
              return caches.keys().then(function (nombres) {
                return Promise.all(nombres.map(function (n) {
                  return caches.open(n).then(function (c) {
                    return c.keys().then(function (ks) {
                      return Promise.all(ks.filter(function (k) { return new URL(k.url).pathname === '/index.html'; }).map(function (k) {
                        return c.put(k, new Response(html, { headers: { 'Content-Type': 'text/html; charset=utf-8' } }));
                      }));
                    });
                  });
                }));
              }).then(function () { location.reload(); });
            });
          }).catch(function () { /* sin señal: no se toca nada */ });
        }, true);
      })();
    </script>
    <script>
      // Anti-flash de tema: aplica data-theme antes de que React monte
      // para que la primera pintura ya tenga colores correctos. Mantener
      // en sync con la clave en src/hooks/useTheme.ts.
      (function () {
        try {
          var stored = window.localStorage.getItem('sam:theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          /* localStorage bloqueado: arrancamos en light */
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
